[package]
name = "lenthm-linux"
version = "0.1.0"
description = "Тепло Lenovo ThinkBook 16 G6 ABP (21KK) на Linux: датчики hwmon и термозоны без root, дневник охлаждения у пользователя"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lenthm-core = { path = "../core", features = ["diary"] }
calor = { git = "https://github.com/Redox-openDriver/calor", tag = "v0.1.0" }
drv-i18n = { git = "https://github.com/Redox-openDriver/drv-i18n", tag = "v0.1.1" }
libc = "0.2"

[[bin]]
name = "lenthm-dev"
path = "src/bin/lenthm-dev.rs"

[[bin]]
name = "lenthmd"
path = "src/bin/lenthmd.rs"
