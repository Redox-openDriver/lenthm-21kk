name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo fmt --check --manifest-path redox/Cargo.toml
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: shell scripts parse
        run: for script in linux/dist/*.sh; do sh -n "$script"; done

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-test-${{ hashFiles('Cargo.lock') }}
      - run: cargo test --locked --release --workspace --no-fail-fast

  nostd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          rustup toolchain install stable --profile minimal --target thumbv7em-none-eabihf
          rustup default stable
      - name: the core builds without the standard library
        run: cargo build --locked --release -p lenthm-core --target thumbv7em-none-eabihf

  redox:
    runs-on: ubuntu-latest
    env:
      TOOLCHAIN: nightly-2026-08-24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: toolchain
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal --target x86_64-unknown-redox
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            redox/target
          key: ${{ runner.os }}-redox-${{ hashFiles('redox/Cargo.lock') }}
      - name: type-check for x86_64-unknown-redox
        working-directory: redox
        run: cargo "+$TOOLCHAIN" check --locked --target x86_64-unknown-redox --all-targets
